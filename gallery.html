:root{--bg:#090711;--text:#f8f4ff;--muted:#b6adbf;--line:#ffffff1c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#633a8b40,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.2em;font-size:1.25rem}.brand span{color:#b58aff}nav{display:flex;gap:28px;color:#c9bfd4;font-size:.92rem}nav a[aria-current=page],nav a:hover{color:#fff}.head{padding:85px 0 40px}.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#c6a3ff;font-weight:800}.head h1{font-size:clamp(3.5rem,8vw,6rem);line-height:.95;letter-spacing:-.07em;margin:15px 0}.head p{color:var(--muted);max-width:600px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 0 90px}.slot{min-height:340px;border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 35%,#70469a66,transparent 50%),linear-gradient(145deg,#21152e,#100d18);display:grid;place-items:center}.slot:nth-child(2n){background:radial-gradient(ellipse at 50% 35%,#a14b9b55,transparent 50%),linear-gradient(145deg,#24152d,#100d18)}.slot img{width:100%;height:100%;min-height:340px;object-fit:cover;display:block;transition:transform .35s}.slot:hover img{transform:scale(1.04)}.slot .label{position:absolute;bottom:16px;left:18px;font-size:.82rem;color:#e7dcef}.notice{grid-column:1/-1;padding:18px 20px;border:1px dashed #c99cff66;border-radius:16px;color:#c9bfd4;background:#17102099}.footer{padding:28px 0;color:#91879d;font-size:.82rem;display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line)}
