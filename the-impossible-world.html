<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>THE IMPOSSIBLE WORLD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c;color:#f3eee4;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;overflow:hidden;background:#08090c;box-shadow:0 20px 90px #000b}
canvas{width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 35%,#02030666 78%,#020306d9 100%)}
.grain{position:absolute;inset:-40%;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:grain .25s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(1%,-1%)}100%{transform:translate(-1%,1%)}}
.hud{position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.24em;color:#e8dfd0a8;text-transform:uppercase}
.brand:before{content:"";display:inline-block;width:19px;height:1px;background:#d7b77c;vertical-align:middle;margin-right:9px}
.hero{margin-bottom:12%;transition:opacity .5s}
.kicker{font-size:8px;letter-spacing:.35em;color:#d9bd8d;text-transform:uppercase;margin-bottom:13px}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(38px,10vw,64px);letter-spacing:-.055em;line-height:.88;margin:0;text-shadow:0 3px 25px #0009}
h1 em{display:block;color:#e0cfb1;font-weight:400}
.tag{font-size:8px;letter-spacing:.23em;color:#ffffff9c;text-transform:uppercase;margin-top:17px}
.counter{color:#dfc38e}
#progress{position:absolute;bottom:0;left:0;width:0;height:2px;background:linear-gradient(90deg,#9d7847,#f1dfb9)}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:10%;text-align:center;transition:opacity .35s}
button{min-width:190px;padding:14px 20px;border:1px solid #d6bd91;background:#d6bd91;color:#111216;font-weight:700;font-size:9px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button.secondary{background:#0b0d11c9;color:#eee3d0;border-color:#c9b18499}
button:disabled{opacity:.5}
#message{font-size:9px;letter-spacing:.14em;color:#e4d6bc;line-height:1.6;text-shadow:0 2px 12px #000}
#export{display:none}
</style>
</head>
<body>
<div id="stage">
<canvas id="view" aria-label="Animated impossible architecture"></canvas>
<div class="shade"></div><div class="grain"></div>
<div class="hud">
 <div class="top"><div class="brand">FORM / 001</div><div>AN ARCHITECTURAL DREAM</div></div>
 <div class="hero" id="hero"><div class="kicker">A study in impossible space</div><h1>THE <em>IMPOSSIBLE</em> WORLD</h1><div class="tag">Where gravity is only a suggestion</div></div>
 <div class="bottom"><span>DESIGNED BEYOND REALITY</span><span class="counter" id="counter">00 : 30</span></div>
</div>
<div class="panel" id="panel">
 <button id="play">ENTER THE WORLD</button>
 <div id="message">30-SECOND CINEMATIC EXPERIENCE<br>VERTICAL 9:16 · SOUND NOT REQUIRED</div>
 <button class="secondary" id="export">EXPORT VIDEO (WEBM)</button>
</div>
<div id="progress"></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl',{antialias:true,alpha:false,preserveDrawingBuffer:true});
const play=document.getElementById('play'),exportBtn=document.getElementById('export'),panel=document.getElementById('panel'),message=document.getElementById('message'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),hero=document.getElementById('hero');
if(!gl){message.textContent='WebGL is not available in this browser.';play.disabled=true;return;}
const vertex=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const fragment=`precision highp float;varying vec2 uv;uniform vec2 resolution;uniform float clock;
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float box(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float scene(vec3 p,float chapter){
 float d=p.y+1.55;
 // Monumental canyon walls, repeating recessed bays.
 vec3 w=p;float bayZ=mod(w.z+2.5,5.)-2.5;
 d=min(d,box(vec3(abs(w.x)-2.9,w.y-.2,bayZ),vec3(.15,3.7,2.25)));
 // Portal nested into the far end of the corridor.
 vec3 a=p;a.z+=7.5;
 float outer=box(a,vec3(2.05,3.45,.25));
 float inner=box(a,vec3(1.62,3.03,.38));
 d=min(d,max(outer,-inner));
 // Suspended monoliths.
 vec3 m=p;m.x-=2.45+.28*sin(clock*.5);m.y-=.1+.35*sin(clock*.7);
 d=min(d,box(m,vec3(.34,1.65,.43)));
 if(chapter>0.7){
   // A marble atrium with an ascending impossible staircase.
   for(int i=0;i<17;i++){float k=float(i);vec3 s=p;s.y-= -1.35+k*.13;s.z-= -1.0+k*.22;s.x-=.25;
     d=min(d,box(s,vec3(1.05,.055,.14)));}
   vec3 ring=p;ring.z+=1.9;
   d=min(d,max(abs(length(ring.xy-vec2(0.,.15))-2.25)-.10,abs(ring.z)-.13));
 }
 if(chapter>1.7){
   // Rotating impossible cross / interlocking axes.
   vec3 q=p;float an=.55*sin(clock*.35);q.xz=mat2(cos(an),-sin(an),sin(an),cos(an))*q.xz;
   d=min(d,box(q,vec3(2.45,.12,.12)));
   d=min(d,box(q,vec3(.12,2.45,.12)));
   d=min(d,box(q,vec3(.12,.12,2.45)));
   vec3 r=p;r.z+=1.4;d=min(d,abs(length(r.xy)-1.38)-.075);
 }
 if(chapter>2.7){
   // Golden infinity-like architectural frame and marble columns.
   vec3 q=p;q.xz=mat2(cos(.25*sin(clock)), -sin(.25*sin(clock)),sin(.25*sin(clock)),cos(.25*sin(clock)))*q.xz;
   float loop=abs(length(q.xy-vec2(0.,.15))-2.65)-.075;
   d=min(d,max(loop,abs(q.z+1.7)-.12));
   for(int j=0;j<5;j++){float k=float(j);vec3 c=p;c.x-=(k-2.)*.78;c.y-=.55;d=min(d,box(c,vec3(.045,2.2,.045)));}
 }
 return d;
}
vec3 normalAt(vec3 p,float ch){vec2 e=vec2(.002,0.);return normalize(vec3(scene(p+e.xyy,ch)-scene(p-e.xyy,ch),scene(p+e.yxy,ch)-scene(p-e.yxy,ch),scene(p+e.yyx,ch)-scene(p-e.yyx,ch)));}
void main(){
 float t=clock;float chapter=mod(t/7.5,4.);
 vec2 p=(uv-.5)*vec2(resolution.x/resolution.y,1.);
 vec3 ro=vec3(.18*sin(t*.22),.1+.18*sin(t*.37),-7.+t*.53);
 float yaw=.11*sin(t*.23)+.08*sin(t*.51);
 vec3 rd=normalize(vec3(p.x*1.02,p.y*1.02,1.62));
 rd.xz=mat2(cos(yaw),-sin(yaw),sin(yaw),cos(yaw))*rd.xz;
 vec3 sky=mix(vec3(.025,.03,.04),vec3(.13,.14,.16),smoothstep(-.35,.8,rd.y));
 sky+=vec3(.28,.23,.16)*pow(max(dot(rd,normalize(vec3(-.4,.8,.25))),0.),25.)*.35;
 float d=0.;vec3 pos=ro;float glow=0.;
 for(int i=0;i<104;i++){pos=ro+rd*d;pos.x+=.08*sin(pos.z*.25+t*.2);float h=scene(pos,chapter);glow+=.001/(.02+abs(h));if(h<.003||d>38.)break;d+=max(.018,h*.72);}
 vec3 col=sky;
 if(d<38.){
   vec3 n=normalAt(pos,chapter);
   float grain=noise(pos*2.4+vec3(0.,t*.012,0.));
   float veins=smoothstep(.73,.91,noise(pos*vec3(3.,13.,3.)));
   vec3 stone=mix(vec3(.28,.30,.32),vec3(.79,.76,.69),grain*.78);
   stone=mix(stone,vec3(.12,.13,.15),veins*.45);
   float gold=smoothstep(.968,.993,noise(pos*4.1+vec3(2.)));
   stone=mix(stone,vec3(.86,.65,.34),gold*(chapter>.8?.8:.22));
   vec3 l=normalize(vec3(-.48,.86,-.32));
   float diffuse=max(dot(n,l),0.);
   float fres=pow(1.-max(dot(n,-rd),0.),3.);
   float spec=pow(max(dot(reflect(-l,n),-rd),0.),36.);
   col=stone*(.2+diffuse)*(.72+.28*noise(pos*2.))+vec3(.9,.72,.43)*spec*.7+vec3(.38,.5,.65)*fres*.25;
   col=mix(col,sky,1.-exp(-d*.035));
 }
 float dust=noise(vec3(p*90.,floor(t*10.)));
 col+=vec3(.58,.48,.32)*smoothstep(.986,1.,dust)*.16+vec3(.32,.22,.1)*glow*.018;
 float vignette=1.-.42*dot(uv-.5,uv-.5);col*=vignette;
 col=col/(1.+col*.4);col=pow(max(col,0.),vec3(.94));
 float fade=smoothstep(0.,.7,t)*(1.-smoothstep(29.3,30.,t));col=mix(vec3(.004,.006,.009),col,fade);
 gl_FragColor=vec4(col,1.);
}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let program;
try{program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));}
catch(e){message.textContent='Graphics setup failed: '+e.message;play.disabled=true;return;}
gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const attr=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,2,gl.FLOAT,false,0,0);
const timeLoc=gl.getUniformLocation(program,'clock'),resLoc=gl.getUniformLocation(program,'resolution');
let active=false,startTime=0,frame=0,recorder=null,parts=[];
function resize(){const ratio=Math.min(devicePixelRatio||1,1.35),w=Math.max(1,Math.floor(canvas.clientWidth*ratio)),h=Math.max(1,Math.floor(canvas.clientHeight*ratio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}gl.uniform2f(resLoc,w,h);}
function draw(now){resize();const t=active?Math.min(30,(now-startTime)/1000):0;gl.uniform1f(timeLoc,t);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 if(active){counter.textContent='00 : '+String(Math.ceil(30-t)).padStart(2,'0');progress.style.width=(t/30*100)+'%';if(t>=30){end();return;}}
 frame=requestAnimationFrame(draw);}
function end(){active=false;cancelAnimationFrame(frame);if(recorder&&recorder.state!=='inactive')recorder.stop();panel.style.opacity='1';panel.style.pointerEvents='auto';play.disabled=false;play.textContent='PLAY AGAIN';exportBtn.style.display='block';message.innerHTML='EXPERIENCE COMPLETE<br>REPLAY OR EXPORT THE ANIMATION';counter.textContent='00 : 30';}
function start(){if(active)return;active=true;startTime=performance.now();panel.style.opacity='0';panel.style.pointerEvents='none';play.disabled=true;exportBtn.style.display='none';progress.style.width='0';cancelAnimationFrame(frame);frame=requestAnimationFrame(draw);}
play.addEventListener('click',start);
function mimeType(){return ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';}
exportBtn.addEventListener('click',()=>{
 const mime=mimeType();if(!canvas.captureStream||!window.MediaRecorder||!mime){message.innerHTML='THIS BROWSER CANNOT EXPORT VIDEO.<br>USE YOUR PHONE SCREEN RECORDER.';return;}
 parts=[];const stream=canvas.captureStream(30);
 try{recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:7000000});}catch(e){message.textContent='Export could not start on this browser.';return;}
 recorder.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
 recorder.onstop=()=>{const blob=new Blob(parts,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-impossible-world.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);message.innerHTML='VIDEO SAVED AS WEBM<br>THE ANIMATION CAN BE CONVERTED TO MP4';panel.style.opacity='1';panel.style.pointerEvents='auto';};
 recorder.start(250);start();
});
window.addEventListener('resize',resize);resize();frame=requestAnimationFrame(draw);
})();
</script>
</body>
</html>
